<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dani Rueda — Window Painting, DC Metro Area</title>
<meta name="description" content="Hand-painted seasonal storefront windows for small businesses across the DC metro area.">

<link rel="canonical" href="https://danirueda.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://danirueda.com/">
<meta property="og:title" content="Dani Rueda — Window Painting">
<meta property="og:description" content="Hand-painted seasonal storefront windows. DC metro area.">
<meta name="theme-color" content="#FBFBFA">
<meta property="og:image" content="https://danirueda.com/mural-cheesetique-ghosts.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://danirueda.com/mural-cheesetique-ghosts.webp">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%239AA0A6'/><rect x='7' y='7' width='18' height='18' fill='none' stroke='white' stroke-width='2'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Rock+Salt&family=Schibsted+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ground: #FBFBFA;   /* gallery white */
    --ink:    #26262A;   /* cool near-black */
    --soft:   #86868C;
    --faint:  #B4B4BA;
    --accent: #5E656C;   /* platinum, darker */
    --blue:   #7FAFD0;   /* light blue */
    --hair:   #E7E7E9;

    --edge:  clamp(1.25rem, 5vw, 4rem);
    --col:   82rem;
  }

  *, *::before, *::after{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum";
  }

  img{ display: block; width: 100%; height: auto; }
  a{ color: inherit; text-decoration: none; }
  ::selection{ background: var(--accent); color: #fff; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 4px; }

  .page{ max-width: var(--col); margin: 0 auto; padding: 0 var(--edge); }

  /* ——— masthead: centred ——— */
  .masthead{
    display: block;
    text-align: center;
    padding: clamp(4rem, 11vh, 7.5rem) 0 clamp(2rem, 5vh, 3.25rem);
  }

  .name{
    margin: 0;
    color: var(--ink);
    font-family: "Rock Salt", cursive;
    font-size: clamp(1.55rem, 5vw, 3.1rem);
    font-weight: 400;
    letter-spacing: .21em;
    text-indent: .21em;
    line-height: 1.3;
    text-transform: uppercase;
  }

  /* uppercase I with a dot floating above it */
  .tittle{ position: relative; }
  .tittle::after{
    content: "";
    position: absolute;
    left: 50%;
    bottom: 1.05em;                 /* raise this to lift the dot */
    width: .11em;
    height: .11em;
    border-radius: 50%;
    background: currentColor;
    /* letter-spacing pads each glyph box on the right — pull back half of it */
    transform: translateX(calc(-50% - .105em));
  }

  /* discipline label, under the name */
  .headline{
    margin: 1.6rem 0 0;
    font-family: "Inter", system-ui, sans-serif;
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .13em;
    text-indent: .13em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--ink);
  }

  .contact{
    margin: .4rem 0 0;
    font-family: "Inter", system-ui, sans-serif;
    font-size: .78rem;
    font-weight: 300;
    color: var(--blue);
  }
  .contact a{ border-bottom: 1px solid transparent; }
  .contact a:hover{ border-bottom-color: var(--blue); }
  .contact .sep{ opacity: .5; margin: 0 .55rem; }

  .nav{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.3rem;
    margin: clamp(4rem, 9.5vw, 6.5rem) 0 0;
    padding: 0;
    list-style: none;
    font-family: "Inter", system-ui, sans-serif;
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .nav a{
    color: var(--faint);
    padding-bottom: 3px;
    border-bottom: 1px solid transparent;
    transition: color .18s ease, border-color .18s ease;
  }
  .nav a:hover{ color: var(--blue); }
  .nav a[aria-current]{ color: var(--ink); border-bottom-color: var(--blue); }

  /* ——— work ——— */
  .work{
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: clamp(3rem, 6vw, 5rem) clamp(1.75rem, 4vw, 3rem);
    padding-bottom: clamp(5rem, 12vw, 8rem);
  }

  figure{ margin: 0; }

  figure img{
    aspect-ratio: 3 / 4;
    object-fit: cover;
    background: #F0F0F1;
  }

  figcaption{
    display: flex;
    align-items: baseline;
    gap: .75rem;
    margin-top: 1.1rem;
  }
  figcaption b{
    font-size: .72rem;
    font-weight: 400;
    letter-spacing: .02em;
    color: var(--ink);
  }
  figcaption .client{
    margin-left: auto;
    text-align: right;
    font-size: .58rem;
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    white-space: nowrap;
  }

  /* ——— footer ——— */
  .foot{
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 2rem;
    align-items: baseline;
    padding: 1.1rem 0 3.5rem;
    font-size: .68rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .foot a:hover{ color: var(--accent); }
  .foot .end{ margin-left: auto; }

  @media (max-width: 52rem){
    .work{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    .nav{ margin-top: clamp(2.5rem, 7vw, 4rem); }
  }
  @media (max-width: 32rem){
    .work{ grid-template-columns: 1fr; }
    figcaption .client{ white-space: normal; }
  }
</style>
</head>

<body>
<div class="page">

  <header class="masthead">
    <h1 class="name">Dan<span class="tittle">i</span> Rueda</h1>
    <p class="headline">Painting</p>
    <p class="contact"><a href="mailto:daniruedaart@gmail.com">daniruedaart@gmail.com</a><span class="sep">·</span>DC Metro Area</p>
    <ul class="nav">
      <li><a href="work.html">Work</a></li>
      <li><a href="murals.html" aria-current="page">Murals</a></li>
      <li><a href="scenic.html">Scenic</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </header>

  <main class="work">

    <figure>
      <img src="mural-see-school-year-clearly.webp" alt="Optical shop window painted with a banner reading See The School Year Clearly above three children in glasses walking toward a yellow school bus." loading="lazy">
      <figcaption><b>See the School Year Clearly</b><span class="client">New Era Eyecare</span></figcaption>
    </figure>

    <figure>
      <img src="mural-cheesetique-ghosts.webp" alt="Cheesetique storefront windows painted with white ghosts trailing curls of smoke." loading="lazy">
      <figcaption><b>Spooky Ghosts</b><span class="client">Cheesetique</span></figcaption>
    </figure>

    <figure>
      <img src="mural-santa-optometrists.webp" alt="Optometrist's window painted with three bearded Santa heads, each wearing a different pair of glasses." loading="lazy">
      <figcaption><b>Santa’s Official Optician</b><span class="client">New Era Eyecare</span></figcaption>
    </figure>

    <figure>
      <img src="mural-del-ray-snowdrifts-detail.webp" alt="Del Ray Pizzeria's window painted with drifted snow banking up the glass beneath scattered white snowflakes." loading="lazy">
      <figcaption><b>Snowdrifts</b><span class="client">Del Ray Pizzeria</span></figcaption>
    </figure>

    <figure>
      <img src="mural-love-at-first-sight.webp" alt="Optical shop window painted with two pink hearts containing lashed eyes, arrows through them, above red script reading Love at First Sight." loading="lazy">
      <figcaption><b>Love at First Sight</b><span class="client">New Era Eyecare</span></figcaption>
    </figure>

    <figure>
      <img src="mural-st-elmos-dalmatians.webp" alt="Corner window of St. Elmo's Coffee Pub painted with two dalmatians in red sunglasses flanking the shop's roundel logo." loading="lazy">
      <figcaption><b>Dog Fest Dalmatians</b><span class="client">St. Elmo’s Coffee Pub</span></figcaption>
    </figure>

  </main>

  <footer class="foot">
    <span>Dani Rueda</span>
    <span><a href="mailto:daniruedaart@gmail.com">daniruedaart@gmail.com</a></span>
    <span class="end">DC Metro Area</span>
  </footer>

</div>
</body>
</html>
